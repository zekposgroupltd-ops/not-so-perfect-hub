<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'">
<title>Create your account — Not So Perfect: Beyond the Film</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main"><div class="wrap"><div class="auth panel">
<h1>Create your account</h1>
<div id="form-error" class="form-error hidden" role="alert"></div>
<form id="auth-form" data-mode="register" novalidate>
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="20" required><div class="hint">3–20 letters, numbers or underscores.</div><div class="field-error" data-error-for="username"></div></div>
<div class="field"><label for="display_name">Display name</label><input id="display_name" name="display_name" autocomplete="nickname" maxlength="40" required><div class="field-error" data-error-for="display_name"></div></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="field-error" data-error-for="email"></div></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="hint">At least 10 characters, with a letter and a number.</div><div class="field-error" data-error-for="password"></div></div>
<div class="field"><label for="password_confirm">Confirm password</label><input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required><div class="field-error" data-error-for="password_confirm"></div></div>
<div class="field"><label class="check"><input type="checkbox" name="accept_rules">I accept the community rules: be respectful, no spam, no harassment. Moderators can review reported content.</label>
<label class="check"><input type="checkbox" name="accept_privacy">I accept the privacy notice: my username, display name and posts are visible to the community.</label><div class="field-error" data-error-for="accept"></div></div>
<button class="btn" type="submit">Create account</button>
<p class="alt">Already a fan? <a href="login.html">Log in</a></p>
</form>
</div></div></main>
<footer class="site-footer"><div class="wrap">
<p>Points are community engagement points. They have no cash value and cannot be exchanged for money.</p>
<p>A community by <a href="#">Zekpo Destiny Films</a>.</p></div></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script><script src="js/home.js"></script>
</body></html>
