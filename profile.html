<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'">
<title>Your profile — Not So Perfect: Beyond the Film</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/community.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main"><div class="wrap"><div class="section">
<div class="profile-head"><div class="avatar" id="avatar" aria-hidden="true"></div><div><h1 id="p-name"></h1><p class="muted" id="p-meta"></p></div></div>
<form id="profile-form" class="panel" novalidate>
<div class="field"><label for="display_name">Display name</label><input id="display_name" name="display_name" maxlength="40"><div class="field-error" data-error-for="display_name"></div></div>
<div class="field"><label for="bio">Bio</label><textarea id="bio" name="bio" maxlength="300"></textarea><div class="hint">Up to 300 characters. Visible to other fans.</div><div class="field-error" data-error-for="bio"></div></div>
<button class="btn" type="submit">Save profile</button>
</form>
<p><button class="btn ghost" id="logout-all" type="button">Log out of all devices</button></p>
</div></div></main>
<footer class="site-footer"><div class="wrap">
<p>Points are community engagement points. They have no cash value and cannot be exchanged for money.</p>
<p>A community by <a href="#">Zekpo Destiny Films</a>.</p></div></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body></html>
