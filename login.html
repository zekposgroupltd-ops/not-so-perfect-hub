<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'">
<title>Log in — Not So Perfect: Beyond the Film</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main"><div class="wrap"><div class="auth panel">
<h1>Log in</h1>
<div id="form-error" class="form-error hidden" role="alert"></div>
<form id="auth-form" data-mode="login" novalidate>
<div class="field"><label for="identifier">Email or username</label><input id="identifier" name="identifier" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div class="field"><label class="check"><input type="checkbox" name="remember">Keep me logged in on this device (30 days)</label></div>
<button class="btn" type="submit">Log in</button>
<p class="alt">New here? <a href="register.html">Create an account</a></p>
</form>
</div></div></main>
<footer class="site-footer"><div class="wrap">
<p>Points are community engagement points. They have no cash value and cannot be exchanged for money.</p>
<p>A community by <a href="#">Zekpo Destiny Films</a>.</p></div></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script><script src="js/home.js"></script>
</body></html>
